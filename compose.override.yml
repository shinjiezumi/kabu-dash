# ローカル開発専用の上書き設定（docker compose up で自動適用される）
# 本番では docker compose -f compose.yml up として本ファイルを無視すること
services:
  nginx:
    volumes:
      - ./data/certs:/etc/nginx/certs
    environment:
      - NGINX_SERVER_NAME=kabu-dash.local.shinjiezumi.com
      - SSL_CERT_PATH=/etc/nginx/certs/cert.pem
      - SSL_CERT_KEY_PATH=/etc/nginx/certs/key.pem

  postgresql:
    ports:
      - "5432:5432"
