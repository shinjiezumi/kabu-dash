services:
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./data/certs:/etc/nginx/certs
    environment:
      - NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-localhost}
      - SSL_CERT_PATH=/etc/nginx/certs/cert.pem
      - SSL_CERT_KEY_PATH=/etc/nginx/certs/key.pem
    depends_on:
      - app

  app:
    build:
      context: ./docker/php
      args:
        INSTALL_PCOV: "true"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - postgresql

  postgresql:
    build:
      context: ./docker/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kabu_dash}
      POSTGRES_USER: ${DB_USERNAME:-kabu_dash}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
